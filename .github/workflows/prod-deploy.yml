name: Deploy SMSWithoutBorders Blog on Server (production)

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_URL: https://blog.smswithoutborders.com
    environment:
      name: production
      url: ${{ env.DEPLOY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm --activate

      - name: Create .env.local file
        run: echo "BASE_URL=${{ env.DEPLOY_URL }}" > .env.local

      - name: Install dependencies
        run: pnpm install --no-lockfile

      - name: Build application
        run: pnpm build

      - name: Clean remote target directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            find "${{ secrets.BUILD_PATH }}" -mindepth 1 -delete

      - name: Copy build artifacts to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "./out/*"
          target: ${{ secrets.BUILD_PATH }}
          strip_components: 1
          rm: false

      - name: Run remote deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            echo "::group::Deploying production build"
            ${{ secrets.BUILD_CMD }}
            echo "Deploy command finished successfully."
            echo "::endgroup::"
