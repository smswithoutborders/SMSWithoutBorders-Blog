name: Deploy SMSWithoutBorders Blog on Server (preview)

on:
  push:
    branches:
      - preview

permissions:
  contents: read

concurrency:
  group: preview-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_URL: https://preview-6.relaysms.afkanerd.de
    environment:
      name: preview
      url: ${{ env.DEPLOY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm --activate

      - name: Create .env.local file
        run: echo "BASE_URL=${{ env.DEPLOY_URL }}" > .env.local

      - name: Install dependencies
        run: pnpm install --no-lockfile

      - name: Build application
        run: pnpm build

      - name: Copy build artifacts to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./out/*"
          target: ${{ secrets.BUILD_PATH }}
          strip_components: 1
          rm: true

      - name: Run remote deploy script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "::group::Deploying preview build"
            ${{ secrets.BUILD_CMD }}
            echo "Deploy command finished successfully."
            echo "::endgroup::"
